name: Publish tag-ontology

on:
  push:
    tags: ['tag-ontology-*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.18.0, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:package

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check package release tag
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('packages/tag-ontology/package.json', 'utf8'));
          assert.equal(process.env.GITHUB_REF_NAME, `tag-ontology-${pkg.version}`);
          JS
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run build
      - name: Publish with provenance
        run: npm publish --workspace tag-ontology --access public --provenance
        env:
          # OIDC is preferred automatically; this optional secret bootstraps the first publish.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
